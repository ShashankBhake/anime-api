# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - allanime-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: allanimeapi.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_379433BF0B29430E8B65B033C3A74877 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C9C39F2258A24E32A367A67093F8B2CF }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: allanimeapi.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_379433BF0B29430E8B65B033C3A74877 }}/anime-api:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_50AB5D68656D4E3B85960ED4D29ECC15 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F585AF6D824A43398702CC241E28334C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6DCA7EB4FBE14AD5BD4494DD3182D315 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'allanime-api'
          slot-name: 'Production'
          images: 'allanimeapi.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_379433BF0B29430E8B65B033C3A74877 }}/anime-api:${{ github.sha }}'
          